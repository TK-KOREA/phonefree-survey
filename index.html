<style>

  .top-row { display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: 15px; color: var(--muted); margin-bottom: 4px; }

  .track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #fill { height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .3s ease; }

  .enter-next { animation: in-next .24s ease both; }
  .enter-prev { animation: in-prev .24s ease both; }

  .q-hint { margin: -12px 0 18px; font-size: 15px; color: var(--muted); }
  .q-hint:empty { display: none; }
  .q-hint b { color: var(--accent); font-weight: 700; }

  .opt {
    position: relative; display: flex; align-items: center; gap: 13px; min-height: 58px; padding: 13px 16px;

  @media (hover: hover) { .opt:hover { border-color: var(--accent); } }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .mark {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center;
    border: 1.5px solid #85857a; background: #fff; transition: background .12s, border-color .12s;

  .radio .mark { border-radius: 50%; }

  .mark svg { width: 15px; height: 15px; opacity: 0; transform: scale(.6); transition: opacity .12s, transform .12s; }
  .opt.on { border-color: var(--accent); background: var(--sage); font-weight: 600; }
  .opt.on .mark { background: var(--accent); border-color: var(--accent); }

  .opt.off { opacity: .45; cursor: default; }
  .opt:has(input:focus-visible) { outline: 3px solid rgba(31, 92, 74, .4); outline-offset: 2px; }

  .field {

  @media (hover: hover) { .primary:hover:not(:disabled) { background: var(--accent-deep); } }

  .back {
    display: inline-flex; align-items: center; gap: 3px; min-height: 44px; padding: 0 10px 0 2px; margin-left: -2px;

  .art { display: block; width: 168px; height: auto; margin: 0 0 22px -6px; }

  .done p { margin: 0 0 24px; max-width: 24em; }
  .trap { position: absolute; left: -9999px; }

  @media (min-width: 640px) {
    #stage { padding-top: 40px; }
    #top { padding-top: 28px; }
    .q-title { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<div id="app">

const DONE_KEY = "phonefree-survey-submitted";
const DRAFT_KEY = "phonefree-survey-draft";

const N = QUESTIONS.length;
const INTRO = -1;
const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.4 3.2L13 4.6"/></svg>';

const $ = (id) => document.getElementById(id);

let advanceTimer = null;

function newId() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
}
function freshState() {
  return { id: newId(), step: INTRO, a: QUESTIONS.map(() => ({ picks: [], other: "", text: "" })) };
}
function store(action) {
  try { return action(window.localStorage); } catch (e) { return null; }
}
function saveDraft() {
  store((s) => s.setItem(DRAFT_KEY, JSON.stringify(state)));
}
function loadDraft() {
  try {
    const d = JSON.parse(store((s) => s.getItem(DRAFT_KEY)));
    if (d && Array.isArray(d.a) && d.a.length === N && typeof d.step === "number" && d.step >= 0 && d.step < N) return d;
  } catch (e) {}
  return null;
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function isValid(i) {
  const q = QUESTIONS[i], a = state.a[i];
  if (q.free) return true;
  if (!a.picks.length) return false;
  return !a.picks.includes(OTHER) || !!a.other.trim();
}
function answerOf(i) {
  const q = QUESTIONS[i], a = state.a[i];
  if (q.free) return a.text.trim();
  const values = a.picks.map((v) => v === OTHER ? OTHER + ": " + a.other.trim() : v);
  return q.multi ? values : values[0];
}
function hintFor(i) {
  const q = QUESTIONS[i], n = state.a[i].picks.length;
  if (q.free) return "선택 사항 · 개인을 알 수 있는 내용은 빼 주세요";

  return "";
}

  $("status").textContent = "";

function renderQuestion(i, dir) {
  chrome(true);
  const q = QUESTIONS[i], a = state.a[i];
  $("count").textContent = (i + 1) + " / " + N;
  $("fill").style.width = ((i + 1) / N * 100) + "%";
  stage.innerHTML = "";
  stage.className = dir;
  void stage.offsetWidth;

  const title = el("h1", "q-title", q.text);
  title.id = "q-title";
  title.tabIndex = -1;
  stage.appendChild(title);
  const hint = el("p", "q-hint");
  hint.innerHTML = hintFor(i);
  stage.appendChild(hint);

  if (q.free) {
    const area = el("textarea", "field");
    area.maxLength = 1000;
    area.value = a.text;
    area.setAttribute("aria-labelledby", "q-title");
    const len = el("p", "len", a.text.length + " / 1000");
    area.addEventListener("input", () => {
      a.text = area.value;
      len.textContent = area.value.length + " / 1000";
      saveDraft();
      syncActions(i);
    });
    stage.appendChild(area);
    stage.appendChild(len);
  } else {
    const group = el("div", q.options.length >= 7 ? "opts dense" : "opts");
    group.setAttribute("role", q.multi ? "group" : "radiogroup");
    group.setAttribute("aria-labelledby", "q-title");
    const inputs = [];
    let otherBox = null;
    const refresh = () => {
      const full = q.max && a.picks.length >= q.max;
      inputs.forEach((input) => {
        const row = input.closest(".opt");
        row.classList.toggle("on", input.checked);
        input.disabled = !!full && !input.checked;
        row.classList.toggle("off", input.disabled);
      });
      if (otherBox) otherBox.style.display = a.picks.includes(OTHER) ? "block" : "none";
      hint.innerHTML = hintFor(i);
      syncActions(i);
    };
    q.options.forEach((label) => {
      const row = el("label", "opt " + (q.multi ? "check" : "radio"));
      const input = el("input");
      input.type = q.multi ? "checkbox" : "radio";
      input.name = "q" + (i + 1);
      input.value = label;
      input.checked = a.picks.includes(label);
      inputs.push(input);
      const mark = el("span", "mark");
      mark.innerHTML = CHECK_ICON;
      row.append(input, mark, el("span", "", label));
      row.addEventListener("pointerdown", () => { pointerPick = true; });
      input.addEventListener("keydown", (e) => {
        pointerPick = false;
        if (e.key === "Enter") { e.preventDefault(); if (isValid(i)) next(); }
      });
      input.addEventListener("change", () => {
        a.picks = inputs.filter((x) => x.checked).map((x) => x.value);
        refresh();
        saveDraft();
        if (label === OTHER && input.checked && otherBox) otherBox.focus();
        else if (!q.multi && pointerPick && isValid(i)) {
          clearTimeout(advanceTimer);
          advanceTimer = setTimeout(() => { if (state.step === i) next(); }, 240);
        }
        pointerPick = false;
      });
      group.appendChild(row);
      if (label === OTHER) {
        otherBox = el("input", "field");
        otherBox.type = "text";
        otherBox.maxLength = 200;
        otherBox.value = a.other;
        otherBox.placeholder = "내용 (개인정보 제외)";
        otherBox.setAttribute("aria-label", "기타 내용");
        otherBox.addEventListener("input", () => { a.other = otherBox.value; saveDraft(); syncActions(i); });
        otherBox.addEventListener("keydown", (e) => { if (e.key === "Enter" && isValid(i)) next(); });
        group.appendChild(otherBox);
      }
    });
    stage.appendChild(group);
    refresh();
  }
  syncActions(i);
  window.scrollTo(0, 0);
  title.focus({ preventScroll: true });
}

function syncActions(i) {
  const q = QUESTIONS[i], last = i === N - 1;
  const nextBtn = $("next");
  nextBtn.disabled = sending || !isValid(i);
  if (sending) nextBtn.textContent = "제출하는 중…";
  else if (!isValid(i)) nextBtn.textContent = state.a[i].picks.includes(OTHER) ? "기타 내용을 적어 주세요" : q.multi ? "하나 이상 선택해 주세요" : "답을 선택해 주세요";
  else if (last) nextBtn.textContent = q.free && !state.a[i].text.trim() ? "의견 없이 제출하기" : "제출하기";
  else nextBtn.textContent = "다음";
}

function next() {
  const i = state.step;
  if (i < 0 || sending || !isValid(i)) return;
  if (i === N - 1) submit(); else goto(i + 1);
}
function back() {
  if (!sending) history.back();
}

async function submit() {
  const bad = QUESTIONS.findIndex((q, i) => !isValid(i));
  if (bad >= 0) { goto(bad); return; }
  if (!ENDPOINT) {
    $("status").textContent = "설문 접수를 준비하고 있습니다. 잠시 후 다시 시도해 주세요.";
    return;
  }
  const payload = { id: state.id, website: $("website").value, answers: {} };
  QUESTIONS.forEach((q, i) => { payload.answers["q" + (i + 1)] = answerOf(i); });
  sending = true;
  $("status").textContent = "";
  syncActions(state.step);
  $("back").disabled = true;
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "rejected");
    store((s) => { s.removeItem(DRAFT_KEY); s.setItem(DONE_KEY, "1"); });
    sending = false;
    showDone();
  } catch (e) {
    sending = false;
    $("status").textContent = "제출하지 못했습니다. 답변은 그대로 있으니 다시 눌러 주세요.";
    syncActions(state.step);
  } finally {
    $("back").disabled = false;
  }
}

function showDone() {
  isDone = true;
  chrome(false);
  stage.className = "";
  stage.innerHTML = "";
  const box = el("section", "center done");
  box.innerHTML = '<svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="42"/><path d="M25 43l12 12 23-25"/></svg>';
  box.appendChild(el("h1", "", "응답이 제출되었습니다"));
  box.appendChild(el("p", "", "소중한 의견은 우리 학교의 「폰프리 스쿨」 운영 방안을 마련하는 데 활용하겠습니다. 감사합니다."));
  const again = el("button", "link", "새 응답 작성하기");
  again.type = "button";
  again.addEventListener("click", () => {
    store((s) => s.removeItem(DONE_KEY));
    isDone = false;
    state = freshState();
    history.replaceState({ step: INTRO }, "");
    renderIntro();
  });
  box.appendChild(again);
  stage.appendChild(box);
  window.scrollTo(0, 0);
}

$("next").addEventListener("click", next);
$("back").addEventListener("click", back);
window.addEventListener("popstate", (event) => {
  if (isDone) { showDone(); return; }
  const step = event.state && typeof event.state.step === "number" ? event.state.step : INTRO;
  if (sending) return;
  goto(step, { push: false });
});

history.replaceState({ step: INTRO }, "");
if (store((s) => s.getItem(DONE_KEY))) showDone(); else renderIntro();
</script>
</body>
</html>
